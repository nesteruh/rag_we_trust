[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragtrust"
version = "0.1.0"
description = "Measuring how RAG systems handle poisoned and conflicting evidence (NLP course project P5, UniMi)."
readme = "README.md"
requires-python = ">=3.11"
# Runtime dependencies: added one by one as each step needs them.
dependencies = [
    "datasets>=3.0",  # Hugging Face hub loader for HotpotQA / FEVER
    "ollama>=0.4",    # client for the local Ollama server
    "pandas>=2.0",    # result tables
    "tqdm",           # progress bars
    "numpy",          # vectors for dense retrieval
    "rank-bm25",      # BM25 retriever
    "matplotlib",     # figures of the final analysis (notebook 06)
    "jupyter",        # notebooks
    "nbconvert",      # run the notebooks from the command line
]


[tool.setuptools.packages.find]
where = ["src"]